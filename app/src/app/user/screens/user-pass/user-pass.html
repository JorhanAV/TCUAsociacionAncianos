<div class="password-wrapper">
  <h2>Cambiar contraseña</h2>
  <p class="subtitle">Actualiza tu contraseña de manera segura</p>

  <form [formGroup]="form" (ngSubmit)="guardar()">

    <!-- Contraseña actual -->
    <mat-form-field appearance="outline" class="full">
      <mat-label>Contraseña actual</mat-label>
      <input matInput [type]="showActual ? 'text' : 'password'" formControlName="actual" />
      <button mat-icon-button matSuffix type="button" (click)="showActual = !showActual">
        <mat-icon>{{ showActual ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>

      <mat-error *ngIf="form.get('actual')?.hasError('required')">
        Ingrese su contraseña actual
      </mat-error>
    </mat-form-field>

    <!-- Nueva contraseña -->
    <mat-form-field appearance="outline" class="full">
      <mat-label>Nueva contraseña</mat-label>
      <input matInput [type]="showNueva ? 'text' : 'password'" formControlName="nueva" />
      <button mat-icon-button matSuffix type="button" (click)="showNueva = !showNueva">
        <mat-icon>{{ showNueva ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>

      <mat-hint align="start">
        Debe tener mínimo 6 caracteres
      </mat-hint>

      <mat-error *ngIf="form.get('nueva')?.hasError('required')">
        La nueva contraseña es obligatoria
      </mat-error>

      <mat-error *ngIf="form.get('nueva')?.hasError('minlength')">
        Debe tener mínimo 6 caracteres
      </mat-error>
    </mat-form-field>

    <!-- Confirmación -->
    <mat-form-field appearance="outline" class="full">
      <mat-label>Confirmar nueva contraseña</mat-label>
      <input matInput [type]="showConfirm ? 'text' : 'password'" formControlName="confirmar" />
      <button mat-icon-button matSuffix type="button" (click)="showConfirm = !showConfirm">
        <mat-icon>{{ showConfirm ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>

      <mat-error *ngIf="form.hasError('noCoincide')">
        Las contraseñas no coinciden
      </mat-error>
    </mat-form-field>

    <!-- Botones -->
    <div class="btn-row">
      <button mat-button type="button" (click)="cancelar()">Cancelar</button>
      <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || cargando">
        <mat-icon>lock</mat-icon>
        Guardar
      </button>
    </div>
  </form>
</div>
