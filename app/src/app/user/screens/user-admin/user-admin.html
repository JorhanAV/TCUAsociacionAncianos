<div class="header-section">
  <div class="title-row">
    <h1>Administración de Usuarios</h1>
    <span class="subtitle">Gestión de acceso y permisos</span>
  </div>
</div>

<!-- Toolbar (Buscador + Botón Crear) -->
<div class="table-toolbar">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Buscar usuario</mat-label>
    <input
      matInput
      placeholder="Nombre, correo, rol..."
      [ngModel]="filtro()"
      (ngModelChange)="filtro.set($event)"
    />
  </mat-form-field>

  <div class="actions">
    <button mat-flat-button color="primary" (click)="abrirFormCrear()">
      <mat-icon>add</mat-icon>
      Crear usuario
    </button>
  </div>
</div>

<!-- Tabla -->
<div class="table-container">
  <table mat-table [dataSource]="usuariosFiltrados()">

    <!-- Nombre -->
    <ng-container matColumnDef="nombre_usuario">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let u" class="col-nombre">
        <span class="main-text">{{ u.nombre_usuario }}</span>
        <span class="sub-text">{{ u.correo }}</span>
      </td>
    </ng-container>

    <!-- Correo -->
    <ng-container matColumnDef="correo">
      <th mat-header-cell *matHeaderCellDef>Correo</th>
      <td mat-cell *matCellDef="let u">{{ u.correo }}</td>
    </ng-container>

    <!-- Rol -->
    <ng-container matColumnDef="rol">
      <th mat-header-cell *matHeaderCellDef>Rol</th>
      <td mat-cell *matCellDef="let u">
        <span class="role-badge" [ngClass]="u.rol.toLowerCase()">
          {{ u.rol }}
        </span>
      </td>
    </ng-container>

    <!-- Acciones -->
    <ng-container matColumnDef="acciones">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let u" class="action-buttons">
        <button mat-icon-button color="primary" (click)="abrirFormEditar(u)">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['nombre_usuario','correo','rol','acciones']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['nombre_usuario','correo','rol','acciones']"></tr>
  </table>
</div>

<!-- === FORMULARIO MODAL (tipo inventario) === -->
@if (mostrarForm) {
<div class="form-overlay" (click)="cerrarForm(false)">
  <div class="form-dialog-wrapper" (click)="$event.stopPropagation()">
    <app-user-form
      [usuario]="usuarioSeleccionado"
      [modo]="modoForm"
      (cerrar)="cerrarForm($event)"
    ></app-user-form>
  </div>
</div>
}
