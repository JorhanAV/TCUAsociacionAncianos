<div class="notfound-container">
  <div class="notfound-right">
    <h1 class="code">404</h1>
    <h2 class="title">¡Ups! No encontramos esta página</h2>

    <p class="message">
      Es posible que la página haya sido eliminada, cambiada
      o quizás nunca existió.  
      <br />
      Pero no te preocupes, puedes volver al inicio.
    </p>

    <button mat-stroked-button color="primary" class="btn-return" (click)="irInicio()">
      <mat-icon>arrow_back</mat-icon>
      Regresar al inicio
    </button>
  </div>
</div>
